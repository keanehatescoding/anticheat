name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # --- userspace: daemon + mock, no kernel module and no root needed ---
  userspace:
    name: userspace build + mock suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build with warnings-as-errors, run the full mock suite
        run: make ci

      - name: Build the privilege-drop test helper (compile check only)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" priv-drop-test

      - name: Build the render-hook test helper (compile check only)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" render-hook-test

      - name: Build the mount-namespace test helper (compile check only)
        run: make CFLAGS="-O2 -Wall -Wextra -Werror" mount-ns-test

      # Dry run only -- against the mock, not a real kernel module, so
      # this proves the harness itself is correct (doesn't crash from its
      # own bugs, exercises every ioctl), not that the kernel survives
      # malformed input. IOCTL_FUZZ_SAFE_POINTERS_ONLY=1 because the mock
      # is plain userspace code with no copy_from_user()/access_ok() of
      # its own -- handing it a NULL/unmapped/wild pointer crashes the
      # mock, not the module under test. See ioctl_fuzz.c's own header
      # comment and README's "ioctl fuzzing" section for the real run
      # (root, a loaded module, full pointer-corruption fuzzing included).
      - name: ioctl fuzz harness dry run against the mock (no root)
        run: |
          make CFLAGS="-O2 -Wall -Wextra -Werror" ioctl-fuzz mock daemon
          LD_PRELOAD="$PWD/test/libmock_anticheat.so" \
            AC_MOCK_ROOT=1 \
            AC_MOCK_STATE="/tmp/ac_mock_fuzz_state_ci" \
            IOCTL_FUZZ_SAFE_POINTERS_ONLY=1 \
            ./test/ioctl_fuzz 1000 20260818

      - name: Ban-pipeline server test (no root, pure Python + HTTP)
        run: ./server/test_server.sh

      - name: RateLimiter bucket-pruning unit test (no root, no network)
        run: python3 server/test_ratelimiter_unit.py

      - name: Shellcheck the shell scripts
        run: |
          command -v shellcheck >/dev/null 2>&1 || \
            { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck test.sh server/test_server.sh server/stress_test.sh diag.sh test/mock_test.sh scripts/dkms-install.sh scripts/kasan_boot_test.sh

  # --- kernel module: compile smoke test against a pinned modern tree ---
  # The module targets kernels >= 6.12 (uses sized_strscpy, the _noprof
  # allocators, for_class_mod_mem_type, maple-tree VMA iteration).  CI
  # prepares a linux-6.12 LTS source tree with defconfig and builds the LKM
  # against it, so the build is deterministic and independent of the runner's
  # own (older) kernel headers.
  module:
    name: kernel module build (linux-6.12 headers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc flex bison libelf-dev libssl-dev dwarves

      - name: Fetch and prepare kernel headers (6.12 LTS, x86_64)
        run: |
          curl -fsSL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.tar.xz | tar -xJ
          make -C linux-6.12 ARCH=x86_64 defconfig
          # defconfig alone leaves module signing off, so modules_prepare
          # below never builds scripts/sign-file -- the DKMS build +
          # signing smoke test step further down needs that tool; without
          # it DKMS silently skips signing and that step's own
          # `grep -q sig_id` assertion fails.
          #
          # MODULE_SIG_HASH has no prompt of its own -- it's a plain
          # `string` symbol whose value is derived entirely from which
          # MODULE_SIG_SHA* boolean choice is enabled (see kernel/module/
          # Kconfig). Setting it directly via --set-val looked like it
          # worked, but olddefconfig recomputes it from the choice on the
          # next line and silently discards the forced value -- verified
          # against a real build: it landed on sha1 (this kernel's
          # apparent choice default), not sha256, even though the .config
          # line briefly said otherwise. Enable the actual choice symbol
          # instead so the derived value is stable under olddefconfig.
          ./linux-6.12/scripts/config --file linux-6.12/.config \
            --enable MODULE_SIG \
            --enable MODULE_SIG_SHA256
          make -C linux-6.12 ARCH=x86_64 olddefconfig
          grep -qx 'CONFIG_MODULE_SIG_SHA256=y' linux-6.12/.config
          grep -qx 'CONFIG_MODULE_SIG_HASH="sha256"' linux-6.12/.config
          make -C linux-6.12 ARCH=x86_64 scripts
          make -C linux-6.12 ARCH=x86_64 modules_prepare

      - name: Build the LKM
        run: |
          # First pass compiles the module; the final modpost link fails only
          # because the prepared tree has no Module.symvers.  Synthesize one
          # from the object's undefined symbols so the link (a compile smoke
          # test) succeeds.  Real load-time symbol resolution is validated on
          # a live kernel (see diag.sh).
          make KDIR="$PWD/linux-6.12" module 2>&1 | tail -3 || true
          nm -u src/anticheat_module.o | awk '{print $2}' | sort -u | \
            awk '{printf "0x00000000\t%s\tvmlinux\tEXPORT_SYMBOL\t\n", $1}' \
            > "$PWD/ksymvers"
          make KDIR="$PWD/linux-6.12" KBUILD_EXTRA_SYMBOLS="$PWD/ksymvers" module
          test -s anticheat.ko
          modinfo ./anticheat.ko | head -6

      - name: Upload module artifact
        uses: actions/upload-artifact@v7
        with:
          name: anticheat-ko
          path: anticheat.ko
          if-no-files-found: error

      # --- static analysis (sparse) ---
      # Kbuild has first-class sparse support built in (C=1/C=2), so this
      # needs no custom integration -- just the tool and a re-invocation
      # of the same build with checking turned on. C=2 (not C=1) is used
      # deliberately: C=1 only re-checks files Kbuild decides need
      # recompiling, and anticheat_module.o was already built to
      # completion by the step above; C=2 forces sparse over every file
      # regardless of up-to-date status. Reuses the same prepared tree
      # and the ksymvers workaround from the build step above -- no
      # separate kernel fetch, no `make clean` needed (the changed
      # C=2/CF= flags alone are enough for Kbuild's .cmd dependency
      # tracking to recompile the object under sparse this time).
      #
      # Fails the job on any finding. The first run against this module
      # (before this comment existed) came back completely clean -- zero
      # warnings across the whole ~1400 lines of hand-rolled kprobe/
      # syscall-table code -- so there's a real, verified-clean baseline
      # to hold, not a guess that one exists.
      - name: Static analysis (sparse)
        run: |
          sudo apt-get install -y -qq sparse
          make KDIR="$PWD/linux-6.12" KBUILD_EXTRA_SYMBOLS="$PWD/ksymvers" \
            C=2 CF="-D__CHECK_ENDIAN__" module 2>&1 | tee sparse.log
          if grep -qE '(warning|error):' sparse.log; then
            echo "::error::sparse reported findings -- see the job log above"
            exit 1
          fi
          echo "sparse: no findings"

      - name: Upload sparse log
        # Steps default to if: success(), which would skip this exact
        # step precisely when it's most wanted: the sparse step above
        # exits 1 on a finding, and without this override the log a
        # failure needs to be diagnosed would never make it off the
        # runner. !cancelled() runs regardless of the sparse step's own
        # outcome, only skipping on a cancelled workflow (where the log
        # may never have been written at all).
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: sparse-log
          path: sparse.log
          if-no-files-found: error

      # --- DKMS path: exercises dkms.conf + Secure Boot signing end to end ---
      # This is the same packaging a player's machine actually uses (see
      # scripts/dkms-install.sh), not just a raw `make module`. It reuses
      # the already-prepared 6.12 tree above instead of the runner's own
      # kernel, since DKMS always targets a specific kernel version's
      # module tree and the runner's live kernel has no matching headers.
      - name: DKMS build + signing smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dkms

          # Point DKMS at the prepared tree via a synthetic version + a
          # /lib/modules/<ver>/build symlink -- the same shape a real
          # kernel-postinst hook sees for a just-installed, not-yet-booted
          # kernel.
          KVER="$(make -s -C linux-6.12 kernelversion)-ci"
          sudo mkdir -p "/lib/modules/${KVER}"
          sudo ln -sf "$PWD/linux-6.12" "/lib/modules/${KVER}/build"

          # Same setup scripts/dkms-install.sh does: a system-wide
          # framework.conf.d fragment pointing DKMS's built-in signing at a
          # key it will self-generate, plus the parent directory it won't
          # create on its own. (DKMS ignores MOK_SIGNING_KEY/MOK_CERTIFICATE
          # if set directly in dkms.conf -- verified against a real build;
          # only the system-wide framework.conf(.d) path actually wires up
          # signing. See the note in dkms.conf.)
          sudo install -d -m 0700 /var/lib/anticheat/mok
          sudo install -d -m 0755 /etc/dkms/framework.conf.d
          printf 'mok_signing_key="/var/lib/anticheat/mok/mok.priv"\nmok_certificate="/var/lib/anticheat/mok/mok.der"\n' \
            | sudo tee /etc/dkms/framework.conf.d/anticheat.conf >/dev/null

          sudo mkdir -p /usr/src/anticheat-1.0.0
          sudo cp -a Makefile dkms.conf src /usr/src/anticheat-1.0.0/

          sudo dkms add -m anticheat -v 1.0.0

          # Same undefined-symbol workaround as the manual build above: the
          # prepared-but-never-linked tree has no Module.symvers.
          sudo env KBUILD_EXTRA_SYMBOLS="$PWD/ksymvers" \
            dkms build -m anticheat -v 1.0.0 -k "$KVER"

          sudo dkms status -m anticheat
          built_ko="$(find "/var/lib/dkms/anticheat/1.0.0/${KVER}" \
            -name 'anticheat.ko' -print -quit)"
          test -n "$built_ko" && test -s "$built_ko"
          # sig_id alone only proves *some* signature was applied, not
          # which hash -- check sig_hashalgo too, the actual built-module
          # confirmation that the sha256 requested in .config (checked
          # earlier, before the build) is what really got used.
          modinfo_out="$(modinfo "$built_ko" | tee /dev/stderr)"
          printf '%s' "$modinfo_out" | grep -q '^sig_id:\s*PKCS#7$'
          printf '%s' "$modinfo_out" | grep -q '^sig_hashalgo:\s*sha256$'
