# DKMS package descriptor for the anticheat kernel module.
#
# Install (from a checkout at /usr/src/anticheat-1.0.0, see scripts/
# dkms-install.sh for the copy step):
#   sudo dkms add    -m anticheat -v 1.0.0
#   sudo dkms build  -m anticheat -v 1.0.0
#   sudo dkms install -m anticheat -v 1.0.0
#
# DKMS reinvokes MAKE[0] automatically on every kernel package upgrade
# (via the /etc/kernel/postinst.d/dkms hook most distros already ship),
# so the module is rebuilt for the new kernel without user action.
#
# Only the kernel module is DKMS's concern; the userspace daemon/CLI is
# built and packaged separately (see Makefile's `daemon` target).

PACKAGE_NAME="anticheat"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="anticheat"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/extra"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"

# DKMS has built-in Secure Boot signing; nothing to configure here for it.
# (An earlier version of this file tried to set MOK_SIGNING_KEY/MOK_CERTIFICATE
# right here in the package's dkms.conf, and before that a custom
# `sign_tool=` hook calling a hand-rolled script. Both were wrong -- verified
# against a real DKMS build. `sign_tool` isn't a real directive in this DKMS;
# it's silently never invoked. MOK_SIGNING_KEY/MOK_CERTIFICATE ARE in dkms's
# whitelist of recognized package-conf variables (so nothing complains about
# them), but this version's signing code never reads them into the
# mok_signing_key/mok_certificate it actually uses. The real hook is
# $mok_signing_key/$mok_certificate loaded from the *system-wide*
# /etc/dkms/framework.conf(.d/*), which applies to every DKMS package on the
# machine, not just this one. scripts/dkms-install.sh installs a
# framework.conf.d fragment pointing those at /var/lib/anticheat/mok/ and
# pre-creates that directory (DKMS's own openssl call won't create missing
# parent directories) before the first build. Without that fragment, DKMS
# still signs modules by default using its own shared key at
# /var/lib/dkms/mok.{key,pub} -- except on Ubuntu, where an unset key first
# tries the Ubuntu-only `update-secureboot-policy` helper and silently skips
# signing if that binary isn't installed. The fragment sidesteps that.
