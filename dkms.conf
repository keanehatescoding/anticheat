# DKMS package descriptor for the anticheat kernel module.
#
# Install (from a checkout at /usr/src/anticheat-1.0.0, see scripts/
# dkms-install.sh for the copy step):
#   sudo dkms add    -m anticheat -v 1.0.0
#   sudo dkms build  -m anticheat -v 1.0.0
#   sudo dkms install -m anticheat -v 1.0.0
#
# DKMS reinvokes MAKE[0] automatically on every kernel package upgrade
# (via the /etc/kernel/postinst.d/dkms hook most distros already ship),
# so the module is rebuilt for the new kernel without user action.
#
# Only the kernel module is DKMS's concern; the userspace daemon/CLI is
# built and packaged separately (see Makefile's `daemon` target).

PACKAGE_NAME="anticheat"
PACKAGE_VERSION="1.0.0"

BUILT_MODULE_NAME[0]="anticheat"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/extra"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

AUTOINSTALL="yes"
REMAKE_INITRD="no"

# Invoked by DKMS as `sign_tool <module.ko>` immediately after a successful
# build, before install.  Generates a MOK signing key on first use (if one
# doesn't already exist) and signs the module with it.  See the script for
# the one-time MOK enrollment step this does NOT do for you (that needs a
# reboot + a keypress in the firmware MokManager UI, so it can't be
# automated headlessly).
sign_tool="/usr/src/${PACKAGE_NAME}-${PACKAGE_VERSION}/scripts/dkms-sign-helper.sh"
